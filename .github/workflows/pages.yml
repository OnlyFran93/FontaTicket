name: Deploy FontaTicket to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build GitHub Pages site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Verify GitHub Pages build paths
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";

          const html = readFileSync("dist/index.html", "utf8");
          const assets = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)]
            .map((match) => match[1]);

          if (assets.length < 2) {
            throw new Error("El build debe incluir bundles JavaScript y CSS.");
          }

          for (const asset of assets) {
            const file = `dist/${asset.replace(/^\/FontaTicket\//, "")}`;
            if (!asset.startsWith("/FontaTicket/assets/") || !existsSync(file)) {
              throw new Error(`Recurso de Pages inválido o ausente: ${asset}`);
            }
          }

          for (const file of ["manifest.webmanifest", "sw.js", "icon-192.png", "icon-512.png"]) {
            if (!existsSync(`dist/${file}`)) {
              throw new Error(`Falta un recurso de Pages: ${file}`);
            }
          }
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
